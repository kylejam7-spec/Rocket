<!doctype html>
<!--
  Creator Dashboard images for every Game Pass and Developer Product (512 x 512).
  render.sh opens this page once per key (icons.html#DoubleCoins) in headless Chrome.
  Game Pass images are shown cropped to a circle, so key art and labels stay inside
  the centre circle; corners are background only.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<script>
const OUT = '#160e20';
const W = 10; // outline width
let uid = 0;
const id = (p) => p + (++uid);

// ---------- shared pieces ----------
function background(inner, outer, opts = {}) {
  const g = id('bg'), r = id('ray');
  let rays = '';
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2, b = a + Math.PI / 16;
    rays += `<path d="M256 256 L${256 + 520 * Math.cos(a)} ${256 + 520 * Math.sin(a)} L${256 + 520 * Math.cos(b)} ${256 + 520 * Math.sin(b)} Z"/>`;
  }
  let stars = '';
  if (opts.stars !== false) {
    const seed = [[70, 90, 3], [430, 70, 4], [460, 200, 2.5], [60, 300, 2.5], [110, 450, 3.5], [440, 440, 3], [300, 40, 2], [30, 180, 2], [480, 330, 2]];
    for (const [x, y, s] of seed) stars += sparkle(x, y, s * 3.2, '#ffffff', 0.85);
  }
  return `<defs><radialGradient id="${g}" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="${inner}"/><stop offset="1" stop-color="${outer}"/></radialGradient>
      <radialGradient id="${r}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <rect width="512" height="512" fill="url(#${g})"/>
    <g fill="url(#${r})">${rays}</g>${stars}`;
}

function sparkle(x, y, s, color = '#fff', opacity = 1) {
  return `<path d="M${x} ${y - s} Q${x + s * 0.18} ${y - s * 0.18} ${x + s} ${y} Q${x + s * 0.18} ${y + s * 0.18} ${x} ${y + s} Q${x - s * 0.18} ${y + s * 0.18} ${x - s} ${y} Q${x - s * 0.18} ${y - s * 0.18} ${x} ${y - s} Z" fill="${color}" opacity="${opacity}"/>`;
}

// Big outlined label, auto-sized to fit `maxWidth`.
function label(text, y, opts = {}) {
  const max = opts.size || 72, width = opts.width || 300;
  const size = Math.min(max, width / (text.length * 0.58));
  return `<text x="${opts.x || 256}" y="${y}" font-family="Fredoka One" font-size="${size.toFixed(1)}" fill="${opts.fill || '#fff'}"
    stroke="${OUT}" stroke-width="${(size * 0.2).toFixed(1)}" stroke-linejoin="round" paint-order="stroke" text-anchor="middle"
    dominant-baseline="middle" letter-spacing="1">${text}</text>`;
}

// Round sticker in the upper right ("2x", "+1").
function badge(text, color, opts = {}) {
  const x = opts.x || 372, y = opts.y || 132, r = opts.r || 62;
  return `<g transform="rotate(12 ${x} ${y})">
    <circle cx="${x}" cy="${y}" r="${r}" fill="${color}" stroke="${OUT}" stroke-width="${W}"/>
    <circle cx="${x}" cy="${y}" r="${r - 12}" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>
    ${label(text, y + 3, { x, size: opts.size || 58, width: r * 1.7 })}</g>`;
}

function shine(cx, cy, rx, ry, rot = -25) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" opacity="0.55" transform="rotate(${rot} ${cx} ${cy})"/>`;
}

// ---------- props ----------
function coin(cx, cy, r) {
  return `<g><circle cx="${cx}" cy="${cy + r * 0.12}" r="${r}" fill="#c77a00" stroke="${OUT}" stroke-width="${W}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffcc28" stroke="${OUT}" stroke-width="${W}"/>
    <circle cx="${cx}" cy="${cy}" r="${r * 0.7}" fill="#ffb300" stroke="#e08f00" stroke-width="5"/>
    <path d="M${cx} ${cy - r * 0.42} L${cx + r * 0.12} ${cy - r * 0.13} L${cx + r * 0.42} ${cy - r * 0.12} L${cx + r * 0.18} ${cy + r * 0.08} L${cx + r * 0.27} ${cy + r * 0.4} L${cx} ${cy + r * 0.22} L${cx - r * 0.27} ${cy + r * 0.4} L${cx - r * 0.18} ${cy + r * 0.08} L${cx - r * 0.42} ${cy - r * 0.12} L${cx - r * 0.12} ${cy - r * 0.13} Z" fill="#fff3b0"/>
    ${shine(cx - r * 0.42, cy - r * 0.45, r * 0.22, r * 0.1)}</g>`;
}

function ufo(cx, cy, s, body, dome = '#9be8ff', beam = false) {
  const lights = [-0.7, -0.35, 0, 0.35, 0.7].map(f => `<circle cx="${cx + f * 120 * s}" cy="${cy + 8 * s + Math.abs(f) * -6 * s}" r="${9 * s}" fill="#fff36b" stroke="${OUT}" stroke-width="${4 * s}"/>`).join('');
  const b = beam ? `<path d="M${cx - 40 * s} ${cy + 30 * s} L${cx - 95 * s} ${cy + 170 * s} L${cx + 95 * s} ${cy + 170 * s} L${cx + 40 * s} ${cy + 30 * s} Z" fill="#b8fff0" opacity="0.45"/>` : '';
  return `<g>${b}
    <path d="M${cx - 62 * s} ${cy - 16 * s} A${62 * s} ${62 * s} 0 0 1 ${cx + 62 * s} ${cy - 16 * s} Z" fill="${dome}" stroke="${OUT}" stroke-width="${W * s}"/>
    ${shine(cx - 26 * s, cy - 52 * s, 16 * s, 8 * s, -35)}
    <ellipse cx="${cx}" cy="${cy + 6 * s}" rx="${140 * s}" ry="${42 * s}" fill="${body}" stroke="${OUT}" stroke-width="${W * s}"/>
    <ellipse cx="${cx}" cy="${cy - 6 * s}" rx="${100 * s}" ry="${20 * s}" fill="#fff" opacity="0.28"/>
    ${lights}</g>`;
}

function paw(cx, cy, s, color) {
  const toe = (x, y, rx, ry, rot) => `<ellipse cx="${cx + x * s}" cy="${cy + y * s}" rx="${rx * s}" ry="${ry * s}" transform="rotate(${rot} ${cx + x * s} ${cy + y * s})" fill="${color}" stroke="${OUT}" stroke-width="${W * s}"/>`;
  return `<g>${toe(-78, -50, 28, 36, -25)}${toe(-28, -92, 30, 38, -8)}${toe(28, -92, 30, 38, 8)}${toe(78, -50, 28, 36, 25)}
    <path d="M${cx} ${cy - 20 * s} C${cx + 60 * s} ${cy - 20 * s} ${cx + 100 * s} ${cy + 40 * s} ${cx + 80 * s} ${cy + 70 * s} C${cx + 60 * s} ${cy + 100 * s} ${cx + 20 * s} ${cy + 80 * s} ${cx} ${cy + 80 * s} C${cx - 20 * s} ${cy + 80 * s} ${cx - 60 * s} ${cy + 100 * s} ${cx - 80 * s} ${cy + 70 * s} C${cx - 100 * s} ${cy + 40 * s} ${cx - 60 * s} ${cy - 20 * s} ${cx} ${cy - 20 * s} Z" fill="${color}" stroke="${OUT}" stroke-width="${W * s}"/>
    ${shine(cx - 30 * s, cy + 10 * s, 18 * s, 9 * s)}</g>`;
}

function dumbbell(cx, cy, s, plate, rot = -18) {
  const p = (x, w, h) => `<rect x="${cx + x * s - w * s / 2}" y="${cy - h * s / 2}" width="${w * s}" height="${h * s}" rx="${10 * s}" fill="${plate}" stroke="${OUT}" stroke-width="${W * s}"/>`;
  return `<g transform="rotate(${rot} ${cx} ${cy})">
    <rect x="${cx - 150 * s}" y="${cy - 14 * s}" width="${300 * s}" height="${28 * s}" rx="${10 * s}" fill="#c9ced8" stroke="${OUT}" stroke-width="${W * s}"/>
    ${p(-150, 28, 90)}${p(-112, 40, 150)}${p(150, 28, 90)}${p(112, 40, 150)}
    <rect x="${cx - 124 * s}" y="${cy - 64 * s}" width="${12 * s}" height="${50 * s}" rx="${6 * s}" fill="#fff" opacity="0.5"/>
    <rect x="${cx + 100 * s}" y="${cy - 64 * s}" width="${12 * s}" height="${50 * s}" rx="${6 * s}" fill="#fff" opacity="0.5"/></g>`;
}

function helmet(cx, cy, s, base, trim, visor, glow, opts = {}) {
  const v = id('visor'), g = id('gal');
  // Galaxy: a nebula body and stars in the visor.
  let body = base, defs = '', stars = '';
  if (opts.galaxy) {
    body = `url(#${g})`;
    defs = `<radialGradient id="${g}" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#8f5cff"/><stop offset="0.6" stop-color="${base}"/><stop offset="1" stop-color="#1c0b45"/></radialGradient>`;
    for (const [x, y, r] of [[-40, -20, 4], [10, -40, 3], [45, 0, 5], [-10, 20, 3], [30, 35, 2.5], [-55, 15, 2.5]]) stars += sparkle(cx + x * s, cy + y * s, r * 3 * s, '#fff', 0.9);
  }
  return `<g><defs><linearGradient id="${v}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${visor}"/><stop offset="1" stop-color="#05030c"/></linearGradient>${defs}</defs>
    <rect x="${cx - 120 * s}" y="${cy + 95 * s}" width="${240 * s}" height="${48 * s}" rx="${20 * s}" fill="${trim}" stroke="${OUT}" stroke-width="${W * s}"/>
    <circle cx="${cx}" cy="${cy}" r="${135 * s}" fill="${body}" stroke="${OUT}" stroke-width="${W * s}"/>
    <rect x="${cx - 150 * s}" y="${cy - 30 * s}" width="${34 * s}" height="${70 * s}" rx="${14 * s}" fill="${trim}" stroke="${OUT}" stroke-width="${W * s}"/>
    <circle cx="${cx + 133 * s}" cy="${cy - 40 * s}" r="${20 * s}" fill="${glow}" stroke="${OUT}" stroke-width="${W * 0.8 * s}"/>
    <rect x="${cx - 92 * s}" y="${cy - 72 * s}" width="${184 * s}" height="${132 * s}" rx="${58 * s}" fill="url(#${v})" stroke="${OUT}" stroke-width="${W * s}"/>
    ${stars}
    <path d="M${cx - 66 * s} ${cy - 30 * s} Q${cx - 60 * s} ${cy - 58 * s} ${cx - 26 * s} ${cy - 60 * s}" stroke="#fff" stroke-opacity="0.75" stroke-width="${12 * s}" fill="none" stroke-linecap="round"/>
    <rect x="${cx - 92 * s}" y="${cy + 40 * s}" width="${184 * s}" height="${12 * s}" rx="${6 * s}" fill="${glow}" opacity="0.8"/>
    ${shine(cx - 70 * s, cy - 98 * s, 30 * s, 12 * s)}</g>`;
}

function crate(x, y, w, color = '#9aa3b5') {
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${w}" rx="${w * 0.12}" fill="${color}" stroke="${OUT}" stroke-width="${W * 0.8}"/>
    <rect x="${x + w * 0.16}" y="${y + w * 0.16}" width="${w * 0.68}" height="${w * 0.68}" rx="${w * 0.08}" fill="none" stroke="#5d6577" stroke-width="${w * 0.07}"/>
    <path d="M${x + w * 0.2} ${y + w * 0.2} L${x + w * 0.8} ${y + w * 0.8}" stroke="#5d6577" stroke-width="${w * 0.08}" stroke-linecap="round"/>
    ${[[0.12, 0.12], [0.88, 0.12], [0.12, 0.88], [0.88, 0.88]].map(([a, b]) => `<circle cx="${x + w * a}" cy="${y + w * b}" r="${w * 0.05}" fill="#e8ecf4"/>`).join('')}
    ${shine(x + w * 0.3, y + w * 0.12, w * 0.14, w * 0.05, 0)}</g>`;
}

function hand(cx, cy, s, color = '#ffd2a8') {
  const f = (x, len, rot) => `<rect x="${cx + x * s - 19 * s}" y="${cy - len * s}" width="${38 * s}" height="${(len + 40) * s}" rx="${19 * s}" transform="rotate(${rot} ${cx + x * s} ${cy})" fill="${color}" stroke="${OUT}" stroke-width="${W * s}"/>`;
  return `<g>${f(-60, 92, -8)}${f(-20, 118, -2)}${f(22, 122, 2)}${f(62, 100, 8)}
    <path d="M${cx - 82 * s} ${cy - 10 * s} L${cx + 84 * s} ${cy - 10 * s} L${cx + 80 * s} ${cy + 90 * s} Q${cx} ${cy + 140 * s} ${cx - 76 * s} ${cy + 90 * s} Z" fill="${color}" stroke="${OUT}" stroke-width="${W * s}" stroke-linejoin="round"/>
    <rect x="${cx + 78 * s}" y="${cy - 30 * s}" width="${40 * s}" height="${100 * s}" rx="${20 * s}" transform="rotate(38 ${cx + 98 * s} ${cy + 60 * s})" fill="${color}" stroke="${OUT}" stroke-width="${W * s}"/>
    <rect x="${cx - 90 * s}" y="${cy + 92 * s}" width="${180 * s}" height="${50 * s}" rx="${18 * s}" fill="#3c8cff" stroke="${OUT}" stroke-width="${W * s}"/></g>`;
}

function arrow(x1, y1, x2, y2, color, w = 34) {
  const a = Math.atan2(y2 - y1, x2 - x1), hl = w * 1.5, hw = w * 1.4;
  const bx = x2 - hl * Math.cos(a), by = y2 - hl * Math.sin(a);
  const px = -Math.sin(a), py = Math.cos(a);
  const pts = [[x1 + px * w / 2, y1 + py * w / 2], [bx + px * w / 2, by + py * w / 2], [bx + px * hw, by + py * hw], [x2, y2],
    [bx - px * hw, by - py * hw], [bx - px * w / 2, by - py * w / 2], [x1 - px * w / 2, y1 - py * w / 2]];
  return `<path d="M${pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L')} Z" fill="${color}" stroke="${OUT}" stroke-width="${W}" stroke-linejoin="round"/>`;
}

function bolt(cx, cy, s, color = '#ffe14a') {
  const p = [[10, -110], [-60, 10], [-6, 10], [-24, 110], [60, -20], [6, -20], [30, -110]].map(([x, y]) => `${cx + x * s} ${cy + y * s}`);
  return `<path d="M${p.join(' L')} Z" fill="${color}" stroke="${OUT}" stroke-width="${W * s}" stroke-linejoin="round"/>`;
}

function stopwatch(cx, cy, r) {
  return `<g><rect x="${cx - 22}" y="${cy - r - 46}" width="44" height="40" rx="10" fill="#ff5a5a" stroke="${OUT}" stroke-width="${W}"/>
    <rect x="${cx + r * 0.62}" y="${cy - r * 0.92}" width="34" height="30" rx="8" transform="rotate(45 ${cx + r * 0.7} ${cy - r * 0.8})" fill="#ff5a5a" stroke="${OUT}" stroke-width="${W}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#ff7b3a" stroke="${OUT}" stroke-width="${W}"/>
    <circle cx="${cx}" cy="${cy}" r="${r * 0.8}" fill="#fff" stroke="${OUT}" stroke-width="${W * 0.7}"/>
    ${Array.from({ length: 12 }, (_, i) => { const a = i / 12 * Math.PI * 2; return `<line x1="${cx + Math.cos(a) * r * 0.66}" y1="${cy + Math.sin(a) * r * 0.66}" x2="${cx + Math.cos(a) * r * 0.74}" y2="${cy + Math.sin(a) * r * 0.74}" stroke="${OUT}" stroke-width="6" stroke-linecap="round"/>`; }).join('')}
    <path d="M${cx} ${cy} L${cx} ${cy - r * 0.8} A${r * 0.8} ${r * 0.8} 0 0 1 ${cx + r * 0.8} ${cy} Z" fill="#4be37a" opacity="0.6"/>
    <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - r * 0.6}" stroke="${OUT}" stroke-width="12" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${cx + r * 0.42}" y2="${cy}" stroke="${OUT}" stroke-width="12" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="12" fill="${OUT}"/>
    ${shine(cx - r * 0.5, cy - r * 0.55, r * 0.2, r * 0.08)}</g>`;
}

function nut(cx, cy, r) {
  const hex = Array.from({ length: 6 }, (_, i) => { const a = i / 6 * Math.PI * 2 + Math.PI / 6; return `${cx + Math.cos(a) * r} ${cy + Math.sin(a) * r}`; });
  return `<g><path d="M${hex.join(' L')} Z" fill="#b7bfcc" stroke="${OUT}" stroke-width="${W}" stroke-linejoin="round"/>
    <circle cx="${cx}" cy="${cy}" r="${r * 0.42}" fill="#5d6577" stroke="${OUT}" stroke-width="${W * 0.7}"/>
    ${shine(cx - r * 0.45, cy - r * 0.5, r * 0.25, r * 0.09)}</g>`;
}

function drop(cx, cy, s, color = '#ff4f96') {
  return `<g><path d="M${cx} ${cy - 110 * s} C${cx + 30 * s} ${cy - 60 * s} ${cx + 80 * s} ${cy - 10 * s} ${cx + 80 * s} ${cy + 35 * s} A${80 * s} ${80 * s} 0 0 1 ${cx - 80 * s} ${cy + 35 * s} C${cx - 80 * s} ${cy - 10 * s} ${cx - 30 * s} ${cy - 60 * s} ${cx} ${cy - 110 * s} Z" fill="${color}" stroke="${OUT}" stroke-width="${W * s}" stroke-linejoin="round"/>
    ${shine(cx - 35 * s, cy + 10 * s, 14 * s, 26 * s, 20)}</g>`;
}

function planet(tex, cx, cy, r, opts = {}) {
  const clip = id('clip'), pat = id('pat'), shade = id('shade');
  const ringBack = opts.ring ? `<ellipse cx="${cx}" cy="${cy}" rx="${r * 1.75}" ry="${r * 0.42}" fill="none" stroke="#e8c98a" stroke-width="${r * 0.2}" transform="rotate(-16 ${cx} ${cy})"/>` : '';
  const ringFront = opts.ring ? `<path d="M${cx - r * 1.75} ${cy} A${r * 1.75} ${r * 0.42} 0 0 0 ${cx + r * 1.75} ${cy}" fill="none" stroke="${OUT}" stroke-width="${r * 0.2 + W * 2}" transform="rotate(-16 ${cx} ${cy})"/>
     <path d="M${cx - r * 1.75} ${cy} A${r * 1.75} ${r * 0.42} 0 0 0 ${cx + r * 1.75} ${cy}" fill="none" stroke="#f3d79c" stroke-width="${r * 0.2}" transform="rotate(-16 ${cx} ${cy})"/>
     <path d="M${cx - r * 1.5} ${cy + r * 0.12} A${r * 1.5} ${r * 0.32} 0 0 0 ${cx + r * 1.5} ${cy + r * 0.12}" fill="none" stroke="#b8935a" stroke-width="${r * 0.05}" transform="rotate(-16 ${cx} ${cy})"/>` : '';
  const ringBackOutlined = opts.ring ? `<ellipse cx="${cx}" cy="${cy}" rx="${r * 1.75}" ry="${r * 0.42}" fill="none" stroke="${OUT}" stroke-width="${r * 0.2 + W * 2}" transform="rotate(-16 ${cx} ${cy})"/>` + ringBack : '';
  return `<g><defs>
      <clipPath id="${clip}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
      <radialGradient id="${shade}" cx="32%" cy="28%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.72"/></radialGradient>
    </defs>
    ${ringBackOutlined}
    <circle cx="${cx}" cy="${cy}" r="${r + W / 2}" fill="${OUT}"/>
    <g clip-path="url(#${clip})">
      <rect x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" fill="${opts.tint || '#888'}"/>
      <image href="${tex}" x="${cx - r * 2.2}" y="${cy - r * 1.1}" width="${r * 4.4}" height="${r * 2.2}" preserveAspectRatio="none" ${opts.filter ? `style="filter:${opts.filter}"` : ''}/>
      ${opts.overlay ? `<rect x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" fill="${opts.overlay}" style="mix-blend-mode:multiply"/>` : ''}
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${shade})"/>
    </g>
    ${ringFront}</g>`;
}

function blackHole(cx, cy, r) {
  const disk = id('disk'), glow = id('glow');
  return `<g><defs>
      <radialGradient id="${glow}" cx="50%" cy="50%" r="50%"><stop offset="0.35" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="0.6" stop-color="#ff5ab4" stop-opacity="0.35"/><stop offset="1" stop-color="#7a3cff" stop-opacity="0"/></radialGradient>
      <linearGradient id="${disk}" x1="0" x2="1"><stop offset="0" stop-color="#ff7a2f"/><stop offset="0.5" stop-color="#fff2a8"/><stop offset="1" stop-color="#ff4fa0"/></linearGradient></defs>
    <circle cx="${cx}" cy="${cy}" r="${r * 1.9}" fill="url(#${glow})"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r * 1.85}" ry="${r * 0.46}" fill="none" stroke="${OUT}" stroke-width="${r * 0.3 + W * 2}" transform="rotate(-14 ${cx} ${cy})"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r * 1.85}" ry="${r * 0.46}" fill="none" stroke="url(#${disk})" stroke-width="${r * 0.3}" transform="rotate(-14 ${cx} ${cy})"/>
    <circle cx="${cx}" cy="${cy}" r="${r * 1.04}" fill="#fff2c4" opacity="0.9"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#020005" stroke="${OUT}" stroke-width="${W}"/>
    <path d="M${cx - r * 1.85} ${cy} A${r * 1.85} ${r * 0.46} 0 0 0 ${cx + r * 1.85} ${cy}" fill="none" stroke="${OUT}" stroke-width="${r * 0.3 + W * 2}" transform="rotate(-14 ${cx} ${cy})"/>
    <path d="M${cx - r * 1.85} ${cy} A${r * 1.85} ${r * 0.46} 0 0 0 ${cx + r * 1.85} ${cy}" fill="none" stroke="url(#${disk})" stroke-width="${r * 0.3}" transform="rotate(-14 ${cx} ${cy})"/></g>`;
}

function ruler(cx, cy) {
  let ticks = '';
  for (let i = 0; i <= 10; i++) ticks += `<line x1="${cx - 150 + i * 30}" y1="${cy - 34}" x2="${cx - 150 + i * 30}" y2="${cy - 34 + (i % 5 === 0 ? 36 : 20)}" stroke="${OUT}" stroke-width="6" stroke-linecap="round"/>`;
  return `<g transform="rotate(-12 ${cx} ${cy})"><rect x="${cx - 176}" y="${cy - 44}" width="352" height="88" rx="16" fill="#ffd23c" stroke="${OUT}" stroke-width="${W}"/>${ticks}
    ${shine(cx - 120, cy - 30, 30, 6, 0)}</g>`;
}

const PLANETS = '../../assets/planets/';
const rarity = { Rare: '#3c96ff', Epic: '#af50ff', Legendary: '#ffaa1e' };

// ---------- the catalogue ----------
const icons = {
  // Game Passes
  DoubleCoins: () => background('#ffd84a', '#d26a00') + coin(200, 230, 82) + coin(300, 190, 82) + coin(250, 292, 82) + label('2X COINS', 408),
  FastHatch: () => background('#4fd2ff', '#1a4fc2') + `<path d="M70 220 L150 220 M50 262 L140 262 M80 304 L150 304" stroke="#fff" stroke-opacity="0.8" stroke-width="16" stroke-linecap="round"/>`
    + ufo(276, 252, 1.05, '#7f8cff') + bolt(372, 150, 0.85) + label('FAST HATCH', 408),
  MultiHatch: () => background('#9b7bff', '#3a1a9e') + ufo(160, 200, 0.6, '#ff7ab8') + ufo(352, 200, 0.6, '#5fe08a') + ufo(256, 290, 0.78, '#4fb4ff') + badge('x3', '#ffcc28', { x: 256, y: 104, r: 54 }) + label('TRIPLE HATCH', 408),
  PetSlot1: () => background('#7dffb0', '#0f9b6a') + paw(248, 250, 1.15, '#ff9ec8') + badge('+1', '#ffcc28') + label('+1 PET SLOT', 408),
  PetSlot2: () => background('#7dffb0', '#0f9b6a') + paw(190, 270, 0.82, '#ffd27a') + paw(318, 210, 0.82, '#ff9ec8') + badge('+2', '#ffcc28') + label('+2 PET SLOTS', 408),
  SuitGold: () => background('#ffe27a', '#b86a00') + helmet(246, 236, 0.98, '#e8a212', '#24201e', '#3b2a10', '#ffa028') + badge('2x', '#ff4f4f') + label('GOLD SUIT', 408),
  SuitCommander: () => background('#8fc8ff', '#1a2a80') + helmet(246, 236, 0.98, '#eef0f6', '#e2b028', '#10183f', '#3c8cff') + badge('4x', '#ff4f4f') + label('COMMANDER', 408),
  SuitGalaxy: () => background('#7b4dff', '#12062e') + helmet(246, 236, 0.98, '#46228f', '#be78ff', '#0a1440', '#50dcff', { galaxy: true }) + badge('8x', '#ff4f4f') + label('GALAXY SUIT', 408),
  // Gym<n>: one design, the multiplier on the badge.
  ...Object.fromEntries([2, 5, 10, 25, 50, 75, 100].map((m, i) => {
    const plates = ['#5fe08a', '#4fb4ff', '#af50ff', '#ff7ab8', '#ff8a2a', '#ff4f4f', '#ffcc28'][i];
    return ['Gym' + (i + 1), () => background('#ffb36b', '#c2361a') + dumbbell(232, 250, 0.92, plates, 0) + badge(m + 'x', '#3c8cff', { size: m >= 100 ? 44 : 54 }) + label('GYM ' + m + 'X', 408)];
  })),
  // Robux upgrade levels: one generic "+1" image per track, used for all 10 level passes.
  BulkPickup: () => background('#ffe08a', '#d27a00') + crate(150, 150, 100) + crate(262, 150, 100) + crate(206, 60, 100) + hand(256, 300, 0.85) + badge('+1', '#5fe08a', { x: 396, y: 268, r: 56 }) + label('BULK PICKUP', 408),
  BulkPlace: () => background('#ffa0d0', '#b0206a') + arrow(256, 70, 256, 210, '#5fe08a', 40) + crate(150, 230, 100) + crate(262, 230, 100) + `<ellipse cx="256" cy="345" rx="150" ry="30" fill="#7ff9ff" opacity="0.55" stroke="#bffcff" stroke-width="6"/>` + badge('+1', '#5fe08a', { x: 400, y: 132, r: 56 }) + label('BULK PLACE', 408),
  PlacementRange: () => background('#8ff0ff', '#1a7ab0') + `<circle cx="256" cy="230" r="150" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="12" stroke-dasharray="20 18"/>`
    + ruler(256, 236) + arrow(256, 236, 106, 268, '#ff4f96', 26) + arrow(256, 236, 406, 204, '#ff4f96', 26) + badge('+1', '#5fe08a', { x: 380, y: 110, r: 56 }) + label('PLACE RANGE', 408),
  // Developer Products
  ServerTraining: () => background('#ff9a6b', '#9e1a3a') + dumbbell(256, 200, 0.9, '#ffcc28', -10) + `<g>${[150, 256, 362].map(x => `<circle cx="${x}" cy="300" r="30" fill="#4fb4ff" stroke="${OUT}" stroke-width="${W}"/><path d="M${x - 44} 350 Q${x} 302 ${x + 44} 350 Z" fill="#4fb4ff" stroke="${OUT}" stroke-width="${W}"/>`).join('')}</g>`
    + badge('2x', '#5fe08a', { x: 400, y: 112, r: 56 }) + label('SERVER 2X', 396) + label('10 MINUTES', 450, { size: 34, width: 240, fill: '#ffe14a' }),
  // Fill<n>: one design; more cargo for bigger packs.
  ...Object.fromEntries([2000, 4000, 7000, 11000, 27500].map((units, i) => {
    const nuts = [[1], [2], [3], [4], [5]][i][0];
    const spots = [[200, 250], [310, 250], [150, 175], [255, 150], [360, 175]];
    let art = '';
    for (let k = nuts - 1; k >= 0; k--) art += k % 2 ? drop(spots[k][0], spots[k][1] + 10, 0.62) : nut(spots[k][0], spots[k][1], 62);
    return ['Fill' + units, () => background('#c7d2e8', '#3a4a6e') + art + label('+' + units.toLocaleString('en-US'), 392, { size: 84 }) + label('ROCKET PARTS', 446, { size: 34, width: 240, fill: '#ffe14a' })];
  })),
  ExtraStay: () => background('#ffcf7a', '#c24a1a') + stopwatch(256, 236, 130) + label('+60 SEC', 408),
  ...Object.fromEntries([
    ['Moon', 'Moon', 'moon_regolith.png', { filter: 'grayscale(1) brightness(1.15)' }],
    ['Mars', 'Mars', 'mars_ground.png', { overlay: '#ff7a4a' }],
    ['Europa', 'Europa', 'europa_ice.png', {}],
    ['Saturn', 'Saturn', 'saturn.png', { ring: true }],
  ].map(([key, name, tex, opts]) => ['Next' + key, () => background('#3a2a7a', '#07041a') + label('NEXT STOP', 72, { size: 44, width: 320, fill: '#ffe14a' })
    + planet(PLANETS + tex, 256, 250, opts.ring ? 105 : 135, opts) + label(name.toUpperCase(), 408)])),
  NextBlackHole: () => background('#3a1a5a', '#020008') + label('NEXT STOP', 72, { size: 44, width: 320, fill: '#ffe14a' }) + blackHole(256, 250, 86) + label('BLACK HOLE', 408),
  ...Object.fromEntries(['Rare', 'Epic', 'Legendary'].map(r => ['Ufo' + r, () => {
    const c = rarity[r];
    return background(c, '#0a0620') + sparkle(130, 140, 22) + sparkle(390, 150, 18) + sparkle(400, 330, 14) + ufo(256, 220, 1.15, c, '#c9f6ff', true) + label(r.toUpperCase() + ' UFO', 408, { fill: r === 'Legendary' ? '#ffe14a' : '#fff' });
  }])),
};

const key = decodeURIComponent(location.hash.slice(1));
if (key === 'list') {
  document.title = Object.keys(icons).join(',');
} else {
  document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">${(icons[key] || icons.DoubleCoins)()}</svg>`;
}
</script>
</body>
</html>
